<svg aria-label="CUNQA split into an emulated upper half — the infrastructure: the vQPUs interfaces, their integration into the HPC system and the interaction between QPUs — and a simulated lower half — the devices: third-party simulators and channel behaviour. Noise belongs to the lower half." role="img" viewbox="0 0 800 340">
<title>What CUNQA emulates and what it simulates</title>
<rect fill="#E4F1EE" height="126" rx="8" stroke="#12695C" stroke-width="1.6" width="720" x="40" y="30"></rect>
<text class="sv-th" fill="#0C3F38" x="58" y="54">EMULATED · the infrastructure</text>
<text class="sv-s" fill="#12695C" x="58" y="72">replicated faithfully · addressed through the interfaces a real deployment would expose</text>
<rect fill="#fff" height="58" rx="5" stroke="#12695C" stroke-width="1" width="212" x="58" y="84"></rect>
<text class="sv-t" text-anchor="middle" x="164" y="106">vQPUs interfaces</text>
<text class="sv-m" fill="#12695C" text-anchor="middle" x="164" y="123">processes that own</text>
<text class="sv-m" fill="#12695C" text-anchor="middle" x="164" y="137">their classical resources</text>
<rect fill="#fff" height="58" rx="5" stroke="#12695C" stroke-width="1" width="212" x="294" y="84"></rect>
<text class="sv-t" text-anchor="middle" x="400" y="106">HPC integration</text>
<text class="sv-m" fill="#12695C" text-anchor="middle" x="400" y="123">on-node or co-located</text>
<text class="sv-m" fill="#12695C" text-anchor="middle" x="400" y="137">as an accelerator would be</text>
<rect fill="#fff" height="58" rx="5" stroke="#12695C" stroke-width="1" width="212" x="530" y="84"></rect>
<text class="sv-t" text-anchor="middle" x="636" y="106">QPU interaction</text>
<text class="sv-m" fill="#12695C" text-anchor="middle" x="636" y="123">how QPUs communicate</text>
<text class="sv-m" fill="#12695C" text-anchor="middle" x="636" y="137">none · classical · quantum</text>
<line stroke="#6B7683" stroke-dasharray="6 4" stroke-width="1.2" x1="40" x2="760" y1="172" y2="172"></line>
<text class="sv-s" text-anchor="middle" x="400" y="166">structure above · physics below</text>
<rect fill="#EDEAFA" height="126" rx="8" stroke="#5B3FB8" stroke-width="1.6" width="720" x="40" y="184"></rect>
<text class="sv-th" fill="#3B2C82" x="58" y="208">SIMULATED · the devices</text>
<text class="sv-s" fill="#5B3FB8" x="58" y="226">behaviour reproduced · delegated to a lower layer</text>
<rect fill="#fff" height="58" rx="5" stroke="#5B3FB8" stroke-width="1" width="330" x="58" y="238"></rect>
<text class="sv-t" text-anchor="middle" x="223" y="260">seven simulators</text>
<text class="sv-m" fill="#5B3FB8" text-anchor="middle" x="223" y="277">Aer · DDSIM · Maestro · Qulacs</text>
<text class="sv-m" fill="#5B3FB8" text-anchor="middle" x="223" y="291">Qsim · QuEST · CunqaSimulator</text>
<rect fill="#fff" height="58" rx="5" stroke="#5B3FB8" stroke-width="1" width="330" x="412" y="238"></rect>
<text class="sv-t" text-anchor="middle" x="577" y="260">channel behaviour</text>
<text class="sv-m" fill="#5B3FB8" text-anchor="middle" x="577" y="277">ideal in version 3.0.0</text>
<text class="sv-m" fill="#5B3FB8" text-anchor="middle" x="577" y="291">no communication noise yet</text>
<text class="sv-s" text-anchor="middle" x="400" y="330">noise is behavioural, so it lives in the lower half — a perfect channel is still a first-class channel</text>
</svg>
