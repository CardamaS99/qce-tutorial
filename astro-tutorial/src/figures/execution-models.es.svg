<text class="sv-t" fill="#3B2C82" text-anchor="middle" x="638" y="261">vQPU · intermediaria</text>
<line stroke="#5B3FB8" stroke-width="1" x1="162" x2="162" y1="276" y2="292"></line>
<line stroke="#5B3FB8" stroke-width="1" x1="400" x2="400" y1="276" y2="292"></line>
<line stroke="#5B3FB8" stroke-width="1" x1="638" x2="638" y1="276" y2="292"></line>
