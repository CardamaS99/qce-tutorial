<rect fill="#fff" height="40" rx="4" stroke="#5B3FB8" stroke-dasharray="3 2" stroke-width="1" width="220" x="290" y="236"></rect>
<text class="sv-t" fill="#3B2C82" text-anchor="middle" x="400" y="261">vQPU · intermediaria</text>
