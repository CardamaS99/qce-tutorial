<svg aria-label="Ciclo de vida de una infraestructura CUNQA levantada: qraise envía un trabajo al planificador que mantiene N vQPU vivas durante un tiempo de pared acotado, qinfo informa de lo que está levantado, el programa de Python se engancha con get_QPUs y ejecuta contra ellas, y qdrop libera los recursos." role="img" viewbox="0 0 800 232">
<title>El ciclo de vida de una infraestructura levantada</title>
