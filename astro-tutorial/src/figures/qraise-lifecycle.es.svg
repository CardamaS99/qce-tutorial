<text class="sv-th" fill="#0C3F38" x="242" y="62">familia · viva durante T</text>
<rect fill="#fff" height="36" rx="4" stroke="#12695C" stroke-width="1" width="134" x="242" y="76"></rect>
<text class="sv-m" fill="#12695C" text-anchor="middle" x="309" y="98">vQPU 0</text>
<rect fill="#fff" height="36" rx="4" stroke="#12695C" stroke-width="1" width="134" x="392" y="76"></rect>
<text class="sv-m" fill="#12695C" text-anchor="middle" x="459" y="98">vQPU 1</text>
<rect fill="#fff" height="36" rx="4" stroke="#12695C" stroke-width="1" width="134" x="242" y="124"></rect>
<text class="sv-m" fill="#12695C" text-anchor="middle" x="309" y="146">vQPU 2</text>
<rect fill="#fff" height="36" rx="4" stroke="#12695C" stroke-width="1" width="134" x="392" y="124"></rect>
<text class="sv-m" fill="#12695C" text-anchor="middle" x="459" y="146">vQPU 3</text>
<text class="sv-s" fill="#12695C" x="242" y="188">qinfo las lista · sobreviven a tu programa</text>
<line stroke="#6B7683" stroke-width="1.2" x1="542" x2="584" y1="60" y2="60"></line>
