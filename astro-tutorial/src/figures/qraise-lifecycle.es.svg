<text class="sv-m" text-anchor="middle" x="105" y="58">qraise -n 4 -t T</text>
<text class="sv-m" fill="#6B7683" text-anchor="middle" x="105" y="72">un trabajo de SLURM</text>
<line stroke="#6B7683" stroke-width="1.2" x1="180" x2="222" y1="60" y2="60"></line>
