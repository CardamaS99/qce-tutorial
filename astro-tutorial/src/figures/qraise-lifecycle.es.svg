<text class="sv-m" text-anchor="middle" x="678" y="58">qdrop --all</text>
<text class="sv-m" fill="#6B7683" text-anchor="middle" x="678" y="72">scancel</text>
<rect fill="#EDEAFA" height="96" rx="6" stroke="#5B3FB8" stroke-width="1.4" width="180" x="588" y="104"></rect>
<text class="sv-t" fill="#3B2C82" text-anchor="middle" x="678" y="126">tu programa</text>
<text class="sv-m" fill="#5B3FB8" text-anchor="middle" x="678" y="146">get_QPUs()</text>
<text class="sv-m" fill="#5B3FB8" text-anchor="middle" x="678" y="163">run(...)</text>
<text class="sv-m" fill="#5B3FB8" text-anchor="middle" x="678" y="180">gather(...)</text>
