# Requires Slurm >= 24.05 (the image builds 24.11; see the Dockerfile).
# "disabled" makes cgroup_g_init() a no-op, so slurmd never reads or writes
# /sys/fs/cgroup and the container needs no privileges. On Ubuntu's 23.11 this
# value does not exist, which is what forced --privileged before.
CgroupPlugin=disabled
